name: Release

# A version tag (v1.2.3) builds TRACE for every system and attaches the binaries to a GitHub release, so the install
# scripts can download them without Go.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "dist/trace_${os}_${arch}${ext}" .
          done
          cd dist && sha256sum * > checksums.txt && cat checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "TRACE $GITHUB_REF_NAME" --generate-notes

  # The real install scripts, against the release just published, for a throwaway user on each system.
  install-smoke:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          sh install.sh
          grep -q '"hook"' "$HOME/.claude/settings.json"
          "$HOME/.local/bin/trace" stats >/dev/null
          "$HOME/.local/bin/trace" uninstall
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'home'; New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          $env:TRACE_BIN_DIR = Join-Path $env:RUNNER_TEMP 'bin'; $env:TRACE_NO_PATH = '1'
          ./install.ps1
          if (-not (Select-String -Quiet '"hook"' (Join-Path $env:USERPROFILE '.claude\settings.json'))) { throw 'hooks missing' }
          & (Join-Path $env:TRACE_BIN_DIR 'trace.exe') stats | Out-Null
          & (Join-Path $env:TRACE_BIN_DIR 'trace.exe') uninstall
