name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # Failing lines become annotations, readable on the run page without downloading the log.
      - run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.out || { grep -E -- '--- FAIL|_test\.go:[0-9]+|panic' test.out | head -30 | sed 's/^/::error::/'; exit 1; }
      - run: go build -o trace-bin .
